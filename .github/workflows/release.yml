name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate
      - run: pnpm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract CHANGELOG notes for release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v',''
          $lines = Get-Content CHANGELOG.md
          $notes = New-Object System.Collections.Generic.List[string]
          $inSection = $false
          foreach ($line in $lines) {
            if ($line -match ("^##\s+\[?" + [regex]::Escape($version) + "\]?(\s|\(|$)")) {
              $inSection = $true
              continue
            }
            if ($inSection -and $line -match '^##\s+') { break }
            if ($inSection) { $notes.Add($line) }
          }
          $notesText = ($notes -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($notesText)) {
            Write-Error "CHANGELOG.md is missing release notes for $version. Every new release must document what changed."
            exit 1
          }
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes-$version.md"
          Set-Content -Path $notesPath -Value $notesText -Encoding utf8
          Write-Host "Wrote release notes for $version to $notesPath"
      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v',''
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes-$version.md"
          if (-not (Test-Path $notesPath)) {
            Write-Error "Release notes file missing for $tag"
            exit 1
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "豆包工作室 $tag" --notes-file $notesPath
          }
          Get-ChildItem release -File | Where-Object {
            $_.Extension -in '.exe', '.blockmap' -or $_.Name -eq 'latest.yml'
          } | ForEach-Object {
            gh release upload $tag $_.FullName --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
