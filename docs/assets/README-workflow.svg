<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">豆包工作室生产流程</title>
  <desc id="desc">从项目和CSV导入，经Core服务、调度、安全门禁、独立网页会话，到产物中心的完整流程</desc>
  <rect width="1200" height="300" rx="24" fill="#121219"/>
  <text x="48" y="52" fill="#f2efff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">一条可回读、可暂停、可恢复的生产链</text>
  <text x="48" y="80" fill="#918ba7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">每一步都有持久化状态；无法确认平台结果时停止，不盲目重复提交。</text>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <g transform="translate(48 112)"><rect width="176" height="116" rx="14" fill="#242136" stroke="#443d67"/><text x="18" y="34" fill="#a29bfe" font-size="13" font-weight="700">01 任务入口</text><text x="18" y="64" fill="#eeeaff" font-size="16" font-weight="700">项目 / CSV / CLI</text><text x="18" y="90" fill="#9d97af" font-size="12">提示词、素材与配置</text></g>
    <path d="M234 170h42" stroke="#6c5ce7" stroke-width="3"/><path d="m268 162 10 8-10 8" fill="none" stroke="#6c5ce7" stroke-width="3"/>
    <g transform="translate(288 112)"><rect width="176" height="116" rx="14" fill="#242136" stroke="#443d67"/><text x="18" y="34" fill="#a29bfe" font-size="13" font-weight="700">02 核心服务</text><text x="18" y="64" fill="#eeeaff" font-size="16" font-weight="700">校验与持久化</text><text x="18" y="90" fill="#9d97af" font-size="12">依赖、锁、运行历史</text></g>
    <path d="M474 170h42" stroke="#6c5ce7" stroke-width="3"/><path d="m508 162 10 8-10 8" fill="none" stroke="#6c5ce7" stroke-width="3"/>
    <g transform="translate(528 112)"><rect width="176" height="116" rx="14" fill="#242136" stroke="#443d67"/><text x="18" y="34" fill="#a29bfe" font-size="13" font-weight="700">03 智能调度</text><text x="18" y="64" fill="#eeeaff" font-size="16" font-weight="700">账号与额度</text><text x="18" y="90" fill="#9d97af" font-size="12">健康、冷却、自动改派</text></g>
    <path d="M714 170h42" stroke="#6c5ce7" stroke-width="3"/><path d="m748 162 10 8-10 8" fill="none" stroke="#6c5ce7" stroke-width="3"/>
    <g transform="translate(768 112)"><rect width="176" height="116" rx="14" fill="#242136" stroke="#443d67"/><text x="18" y="34" fill="#a29bfe" font-size="13" font-weight="700">04 安全执行</text><text x="18" y="64" fill="#eeeaff" font-size="16" font-weight="700">独立 Webview</text><text x="18" y="90" fill="#9d97af" font-size="12">稳定回读、单次发送</text></g>
    <path d="M954 170h42" stroke="#6c5ce7" stroke-width="3"/><path d="m988 162 10 8-10 8" fill="none" stroke="#6c5ce7" stroke-width="3"/>
    <g transform="translate(1008 112)"><rect width="144" height="116" rx="14" fill="#302654" stroke="#6c5ce7"/><text x="18" y="34" fill="#c6bcff" font-size="13" font-weight="700">05 结果</text><text x="18" y="64" fill="#fff" font-size="16" font-weight="700">产物中心</text><text x="18" y="90" fill="#bdb6ce" font-size="12">绑定、下载、重试</text></g>
  </g>
</svg>
