    <circle cx="90" cy="226" r="5" fill="#f87171"/><circle cx="109" cy="226" r="5" fill="#fbbf24"/><circle cx="128" cy="226" r="5" fill="#4ade80"/>
    <text x="158" y="232" fill="#ddd8f2" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">当前项目：短视频生产计划</text>
    <rect x="80" y="263" width="235" height="226" rx="12" fill="#1d1c2a" stroke="#302d43"/>
    <text x="98" y="293" fill="#f0edff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">账号工作区</text>
    <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">
