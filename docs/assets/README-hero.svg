<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">豆包工作室多账号内容生产工作台</title>
  <desc id="desc">项目、任务队列、独立账号网页和产物中心组成的三栏工作台示意图</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0f14"/>
      <stop offset="1" stop-color="#191527"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="80" r="180" fill="#6c5ce7" opacity=".10"/>
  <circle cx="105" cy="520" r="210" fill="#a29bfe" opacity=".06"/>
  <text x="64" y="76" fill="#a29bfe" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" letter-spacing="2">DOUBAO STUDIO</text>
  <text x="64" y="125" fill="#f4f1ff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">从任务清单到可追踪产物</text>
  <text x="64" y="160" fill="#aaa5c0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">多账号隔离 · 队列调度 · CSV 批量导入 · 安全提交 · 产物绑定与下载</text>
