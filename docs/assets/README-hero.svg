      <rect x="347" y="368" width="328" height="48" rx="8" fill="#242231"/><text x="362" y="389" fill="#ded9ef">C01-B 商品细节视频</text><text x="362" y="407" fill="#fbbf24">配置参数 · Fast · 5s</text>
