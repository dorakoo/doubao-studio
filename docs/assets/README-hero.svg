    <rect x="707" y="263" width="413" height="226" rx="12" fill="#20202a" stroke="#302d43"/>
    <rect x="724" y="280" width="379" height="34" rx="7" fill="#292936"/><text x="742" y="302" fill="#aaa5b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">独立网页会话 · 平台原生界面</text>
    <rect x="724" y="329" width="379" height="96" rx="9" fill="#f3f3f6"/>
    <rect x="745" y="346" width="224" height="12" rx="6" fill="#d8d6df"/><rect x="745" y="368" width="301" height="12" rx="6" fill="#dedce5"/><rect x="745" y="390" width="258" height="12" rx="6" fill="#dedce5"/>
    <rect x="724" y="440" width="182" height="32" rx="8" fill="#29263a"/><text x="748" y="461" fill="#d8d3e9" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">回读提交状态</text>
    <rect x="921" y="440" width="182" height="32" rx="8" fill="#6c5ce7"/><text x="956" y="461" fill="white" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">绑定并下载产物</text>
