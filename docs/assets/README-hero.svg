      <rect x="96" y="362" width="203" height="42" rx="8" fill="#242231"/><circle cx="113" cy="383" r="5" fill="#fbbf24"/><text x="128" y="388" fill="#ded9ef">创作账号 B</text><text x="232" y="388" fill="#9f99b6">生成中</text>
      <rect x="96" y="414" width="203" height="42" rx="8" fill="#242231"/><circle cx="113" cy="435" r="5" fill="#f87171"/><text x="128" y="440" fill="#ded9ef">创作账号 C</text><text x="220" y="440" fill="#9f99b6">需登录</text>
    </g>
    <rect x="331" y="263" width="360" height="226" rx="12" fill="#1d1c2a" stroke="#302d43"/>
    <text x="349" y="293" fill="#f0edff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">任务调度</text>
